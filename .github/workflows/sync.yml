name: Upstream Sync (PR)

on:
  workflow_dispatch:   # 允许手动触发
  schedule:
    - cron: "0 3 * * *"   # 每天凌晨 3 点同步

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch upstream
        run: |
          set -euxo pipefail
          git remote remove upstream || true
          git remote add upstream https://github.com/samqin123/MoonTV.git
          git fetch upstream --prune
          
          # 自动识别上游默认分支（main / master）
          if git show-ref --verify --quiet refs/remotes/upstream/main; then UPBR=main;
          elif git show-ref --verify --quiet refs/remotes/upstream/master; then UPBR=master;
          else echo "Upstream has neither main nor master"; exit 1; fi
          echo "Using upstream branch: $UPBR"
          
          git checkout -B sync/upstream
          git reset --hard "upstream/$UPBR"

      # 新增：首次推送分支到远端，避免推送失败
      - name: Push sync branch to origin
        run: |
          set -euxo pipefail
          git push -u origin sync/upstream --force --no-verify

      - name: Open PR to main
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}   # 显式使用写权限 token
          branch: sync/upstream                # 推送的分支
          base: main                           # 如果你的默认分支不是 main，改这里
          title: "chore: sync with upstream"
          body: "Automated sync from upstream."
          delete-branch: true                  # 合并后删临时分支
