name: Upstream Sync (PR)

on:
  schedule:
    - cron: "0 3 * * *"   # 每天 03:00 运行；想先取消定时可先注释掉本行
  workflow_dispatch:       # 允许手动触发

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/samqin123/MoonTV.git
          git fetch upstream
          git checkout -B upstream-sync
          git reset --hard upstream/main   # 如果上游默认分支是 master 就改成 upstream/master

      - name: Open PR to main
        uses: peter-evans/create-pull-request@v6
        with:
          branch: upstream-sync
          base: main           # 你的默认分支不是 main 就改掉
          title: "chore: sync with upstream"
          body: "Automated sync from upstream."
          labels: sync
